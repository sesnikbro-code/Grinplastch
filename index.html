<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="גרינפלסטש">
<meta name="theme-color" content="#0a1730">
<link rel="manifest" href="manifest%20(2).webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>הצעות מחיר גרינפלסטש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* White and the deep navy of the quote's top band, with the logo's electric blue as the accent; one light theme by choice.
     Layout: phone app shell — navy top bar, scrolling column on near-white, white bottom tabs. */
  --bg:#f3f5f9;
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --line:#d8dfe9;
  --text:#132238;
  --muted:#5d6b80;
  --blue:#1f6fd6;
  --blue-dk:#0b2545;
  --blue-soft:#eaf2fd;
  --gold:#3d8cf0;
  --gold-lt:#a9cdfb;
  --ok:#1e9a5a;
  --no:#cf4336;
  --warn:#b4720f;
  --display:"Rubik","Heebo",system-ui,-apple-system,sans-serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
a{color:var(--blue)}
.hidden{display:none!important}

/* top bar */
.topbar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 16px 8px;background:radial-gradient(ellipse at center,#0f2347 0%,#0a1730 70%);color:#fff;border-bottom:3px solid #1f6fd6;box-shadow:0 2px 14px rgba(10,23,48,.3)}
.topbar img{width:42px;height:auto;border-radius:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:.01em;color:var(--gold-lt)}
.brand span{font-size:12.5px;color:rgba(255,255,255,.8)}
.side{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.conn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.88)}
.ver{font-size:11px;line-height:1;color:rgba(255,255,255,.6);letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;background:#9fb3d6}
.dot.on{background:#5be39a;box-shadow:0 0 0 3px rgba(91,227,154,.25)}
.dot.wait{background:#ffd166}

main{padding:calc(76px + var(--safe-t)) 16px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}

/* bottom tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(19,34,56,.06);padding:6px 6px calc(6px + var(--safe-b))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab span{white-space:nowrap;font-size:11.5px}
.gearbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gearbtn svg{width:22px;height:22px}
.gearbtn.on{background:#1f6fd6;border-color:#1f6fd6}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money3 .stat b{font-size:19px}
.stat.inc b{color:#12804a}.stat.exp b{color:#c2410c}.stat.neg b{color:#c62828}
.prow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;color:var(--text);font:inherit;cursor:pointer}
.prow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .t{font-weight:700}.prow .s{font-size:13px;color:var(--muted)}
.prow .nums{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .nums .p{font-weight:800;font-size:15px}
.pos{color:#12804a}.negc{color:#c62828}.expc{color:#c2410c}
.xgroup{border:1px solid var(--line);border-radius:14px;padding:4px 12px;background:var(--surface)}
.xgroup h3{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin:8px 0 2px}
.xrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.xrow .d{color:var(--muted);font-size:12.5px;white-space:nowrap}.xrow .w{flex:1;min-width:0}.xrow .a{font-weight:700;white-space:nowrap}
.xrow .rm{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer}
.projbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
select.xsel{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text)}
input.xdate{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--text)}
.tab.on{color:var(--blue);font-weight:700}
.tab.on::before{content:"";position:absolute;top:-6px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.head h1{font-size:24px;font-weight:800;color:var(--text)}
.head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(19,34,56,.05)}
.card h2{font-size:16px;font-weight:700;color:var(--blue-dk);display:flex;align-items:center;gap:8px}
.card h2 svg{flex:0 0 20px;width:20px;height:20px}
.card h2 .n{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{flex:0 0 18px;width:18px;height:18px;color:var(--blue);margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}

label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=tel],input[type=email],input[type=search],input:not([type]),textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{resize:vertical;min-height:90px;line-height:1.55}
textarea.big{min-height:180px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(31,78,140,.18)}
::placeholder{color:#8d9ab0}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #c3d6f2;background:var(--blue-soft);color:var(--blue-dk);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
.ctbtn svg{width:17px;height:17px}
.ctmsg{font-size:13.5px;line-height:1.45;color:#a33b2b;font-weight:600}
.ctmsg:empty{display:none}
.ctmsg.ok{color:#1d7a46}
.ctmsg.wait{color:var(--muted);font-weight:500}
.ctbtns{display:flex;gap:6px}
.check input{width:20px;height:20px;accent-color:var(--blue)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15.5px;border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--text);min-height:46px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 18px rgba(31,78,140,.22)}
.btn.primary:active{background:var(--blue-dk)}
.btn.big{min-height:56px;font-size:17.5px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--blue-dk)}
.btn.danger{color:var(--no);border-color:rgba(207,67,54,.4);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>.btn{flex:1 1 auto}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.iconbtn svg{width:20px;height:20px}

/* images */
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(19,34,56,.75);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.gap{outline:3px solid #e8a400!important;outline-offset:2px;background:#fff8e1!important;animation:gapPulse 1s ease-in-out 3}
@keyframes gapPulse{50%{outline-color:transparent}}
.impcard .btns{margin-top:10px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%;color:var(--text)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
div.item{cursor:default}
div.item .s{white-space:normal;overflow:visible}
button.main{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer}
.item .cur{font-size:12px;font-weight:700;color:var(--blue)}
.item .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.item .amt{font-weight:700;font-size:15px}
.avatar{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--blue-dk);background:var(--blue-soft);border:1px solid #cbd8ea}
.empty{padding:22px 6px;text-align:center;color:var(--muted);font-size:14.5px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
.st-pending{color:var(--warn);border-color:rgba(180,114,15,.4);background:#fdf4e3}
.st-ok{color:var(--ok);border-color:rgba(30,154,90,.4);background:#e7f6ee}
.st-paid{color:#0b4fb3;border-color:rgba(31,111,214,.45);background:#e8f1fd}
.st-cancel{color:#6b7585;border-color:#cfd6e0;background:#f1f3f6;text-decoration:line-through}
.dealbtns{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.dealbtns .btn{flex:1}
.btn.paid{background:#12804a;border-color:#12804a;color:#fff}
.collect{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.collect b{font-variant-numeric:tabular-nums}
.st-no{color:var(--no);border-color:rgba(207,67,54,.4);background:#fcebe9}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button.on{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--blue)}
.stat span{font-size:12.5px;color:var(--muted)}

.banner{border:1px solid #cbd8ea;background:var(--blue-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:0 0 20px;width:20px;height:20px;color:var(--blue)}
.banner.warn{border-color:rgba(207,67,54,.35);background:#fcebe9}
.banner.warn svg{color:var(--no)}
.banner ul{margin:4px 0 0;padding-inline-start:18px}

/* match box */
.match{border-radius:12px;padding:12px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.match.existing{border:1px solid rgba(30,154,90,.45);background:#eef9f3}
.match.new{border-color:#c3d2e7;background:var(--blue-soft)}
.match .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* form sections */
.sec-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.sec-card .top{display:flex;gap:8px;align-items:center}
.it-list{display:flex;flex-direction:column;gap:8px}
.it-row{display:flex;align-items:center;gap:8px}
.it-row>.fld{flex:1;min-width:0}
.qty{flex:none;display:flex;align-items:center;height:46px;padding:0 2px;border-radius:999px;background:#fff;border:1.5px solid #c3d6f2;box-shadow:0 1px 2px rgba(11,37,69,.06);transition:border-color .15s}
.qty button{width:34px;height:42px;border:0;background:none;color:var(--blue);font-size:22px;font-weight:700;line-height:1;cursor:pointer;padding:0;border-radius:50%}
.qty button:active{background:var(--blue-soft)}
.qty input.qty-n{width:34px;height:30px;padding:0;border:0;border-radius:999px;background:var(--blue-soft);text-align:center;font-weight:800;font-size:16px;color:var(--blue-dk);box-shadow:none}
.qty.on{border-color:var(--blue)}
.qty.on input.qty-n{background:var(--blue);color:#fff}
.addrow{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #b9cdea;background:none;color:var(--blue);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;cursor:pointer}
.sec-card input,.sec-card textarea{background:#fff}
.bd-row{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:start}
.bd-row>.iconbtn{margin-top:5px}
.preset{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--blue-dk);display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary svg{width:20px;height:20px}

/* quote actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);text-decoration:none;text-align:center}
.act svg{width:24px;height:24px;color:var(--blue)}
.act.danger svg{color:var(--no)}
.act:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* client card */
.ccard{background:linear-gradient(150deg,#163a73,#0a1730);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 3px 0 var(--gold),0 10px 30px rgba(20,47,87,.28)}
.ccard .who{display:flex;gap:12px;align-items:center}
.ccard .who h1{font-size:22px}
.ccard .avatar{background:#fff;color:var(--blue-dk);border:2px solid var(--gold)}
.ccard a{color:#fff}
.ccard .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.ccard .btn.primary{background:#fff;color:var(--blue-dk);border-color:#fff;box-shadow:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:rgba(255,255,255,.75)}
.kv dd{margin:0}

/* overlay, modal, toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,30,55,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.busy{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;min-width:260px;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(19,34,56,.25)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #dde5f0;border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.locked>*:not(#lock){visibility:hidden}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#0f2347,#0a1730);color:#fff;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:auto}
.lk-box{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px;text-align:center;margin:auto}
.lk-logo{width:84px;height:84px;border-radius:20px;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.lk-title{font-size:21px;font-weight:700}
.lk-sub{font-size:14px;color:rgba(255,255,255,.78);line-height:1.5}
.lk-dots{display:flex;gap:14px;direction:ltr;min-height:16px;margin-top:4px}
.lk-dots span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.lk-dots span.on{background:#fff;border-color:#fff}
.lk-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lk-msg{min-height:21px;font-size:14px;color:#ffd27a}
.lk-pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px;direction:ltr}
.lk-pad button{width:74px;height:74px;border-radius:50%;border:0;background:rgba(255,255,255,.13);color:#fff;font-size:30px;font-weight:500;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.lk-pad button:active{background:rgba(255,255,255,.32)}
.lk-pad .lk-ok,.lk-pad .lk-del{background:transparent;font-size:17px;font-weight:700}
.lk-pad .lk-ok:disabled{opacity:.3}
.lk-pad .lk-del svg{width:30px;height:30px;pointer-events:none}
.lk-bio{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.13);border:0;border-radius:22px;color:#fff;padding:18px 34px;font-size:18px;font-weight:700;cursor:pointer;margin-top:6px}
.lk-bio:active{background:rgba(255,255,255,.3)}
.lk-bio svg{width:52px;height:52px}
.lk-bio:disabled{opacity:.5}
.lk-admin{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:6px;width:40px;height:40px;border:0;background:transparent;padding:0;cursor:pointer}
.lk-admin::after{content:"";position:absolute;left:16px;top:16px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28)}
.lk-link{background:none;border:0;color:rgba(255,255,255,.82);font-size:15px;padding:8px;text-decoration:underline;cursor:pointer}
.lk-forgot label{display:flex;flex-direction:column;gap:8px;width:100%}
.lk-forgot input{background:#fff;color:#16202e}
.lk-forgot .btn.danger{background:#cf4336;color:#fff;border:0;width:100%}
.modal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(19,34,56,.25)}
.modal h3{font-size:18px}
.fpop-who{display:flex;flex-direction:column;gap:2px}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.fpop-who b{font-size:17px}
.fpop-msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;max-height:34vh;overflow:auto}
.danger-card{border-color:#e9b8b2}
.danger-card h2{color:var(--no)}
.btn:disabled{opacity:.45;pointer-events:none}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:#132238;color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(19,34,56,.3)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}*{transition:none!important}}

.btn.rec{background:#fcebe9;color:var(--no);border-color:rgba(207,67,54,.45)}
.dictrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kw{display:inline-block;background:var(--blue-soft);color:var(--blue-dk);border-radius:6px;padding:0 6px;font-weight:700}
.tab .badge{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.follow{box-shadow:inset 0 3px 0 var(--warn),0 1px 3px rgba(19,34,56,.05)}
.frow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:none;border:0;padding:0;text-align:start;cursor:pointer;color:var(--text)}
.frow .who b{font-size:16px}
.frow .btns>.btn{flex:0 0 auto}
.vatline{font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.vatline b{color:var(--text)}
.finfo{font-size:14px;display:flex;flex-direction:column;gap:8px;background:#fdf4e3;border:1px solid rgba(180,114,15,.35);border-radius:12px;padding:10px 12px}
.finfo .btns>.btn{flex:0 0 auto}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.catbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--blue-dk);cursor:pointer}
.catbtn:active{background:var(--blue-soft)}
ul.fixed{margin:0;padding-inline-start:20px;font-size:15px}
.fld{position:relative;display:block}
.fld>input,.fld>textarea{padding-left:50px}
.micbtn{position:absolute;left:6px;top:6px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s,background .12s}
.micbtn svg{width:19px;height:19px;pointer-events:none}
textarea.grow{min-height:0;resize:none;overflow:hidden;line-height:1.5}
.fld.nomic>input,.fld.nomic>textarea{padding-left:14px}
.fld:focus-within>input,.fld:focus-within>textarea{padding-left:92px}
.fld.nomic:focus-within>input,.fld.nomic:focus-within>textarea{padding-left:50px}
.okbtn{position:absolute;left:48px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;visibility:hidden;opacity:0;transition:visibility 0s .6s,opacity 0s .6s}
.fld.nomic .okbtn{left:6px}
.fld:focus-within .okbtn{visibility:visible;opacity:1;transition:none}
.okbtn svg{width:20px;height:20px;pointer-events:none}
.micbtn.rec{background:var(--no);border-color:var(--no);color:#fff;transform:scale(1.18);box-shadow:0 0 0 6px rgba(207,67,54,.2);animation:pulse 1s ease-in-out infinite}
.micbtn.busy{color:transparent;background:#fff}
.micbtn.busy::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #dde5f0;border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(207,67,54,.08)}}
.recpill{position:fixed;z-index:70;top:calc(70px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--no);color:#fff;font-weight:700;font-size:14.5px;padding:8px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 8px 24px rgba(207,67,54,.35)}
.recpill .rdot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
/* quote pages (canvas) */
.pages{display:flex;flex-direction:column;gap:12px}
.page{display:block;width:100%;height:auto;border-radius:4px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(19,34,56,.14)}
.page-ph{width:100%;aspect-ratio:794/1123;border-radius:4px;background:#e9eef6;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
</style>
</head>

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const lines = s => String(s || '').split('\n').map(x => x.replace(/^\s*[-•*·]\s*/, '').trim()).filter(Boolean);
const numStr = s => { const t = String(s == null ? '' : s).replace(/[^\d.]/g, ''); return t; };
const toNum = s => { const t = numStr(s); return t === '' || isNaN(Number(t)) ? null : Number(t); };
const fmtNum = n => Number(n).toLocaleString('he-IL', { maximumFractionDigits: 2 });
const fmtMoney = n => fmtNum(n) + ' ש"ח';
function today() { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }
function newId(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function initials(n) { const t = nameTokens(n); return t.length ? (t[0][0] + (t[1] ? t[1][0] : '')) : '?'; }
function shortDate(ms) { if (!ms) return ''; const d = new Date(ms); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getFullYear()).slice(2); }

function normPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('972')) d = '0' + d.slice(3);
  if (d.length === 9 && !d.startsWith('0')) d = '0' + d;
  return d.length >= 9 ? d : '';
}
function intlPhone(p) { const d = normPhone(p); return d ? '972' + d.slice(1) : ''; }
const STOP = new Set(['מר', 'גב', 'גברת', 'משפחת', 'משפ', 'לכבוד', 'הלקוח', 'לקוח', 'עבור', 'של', 'את', 'ה', 'ו']);
function nameTokens(n) {
  return String(n || '').replace(/["'״׳`.,\-–—()\/]/g, ' ').split(/\s+/).map(t => t.trim()).filter(t => t && !STOP.has(t));
}

/* client matching: phone first, then identical name, then partial name suggestions */
function findMatches(name, phone, clients) {
  const p = normPhone(phone), toks = nameTokens(name);
  let strong = null; const cands = [];
  if (p) strong = clients.find(c => normPhone(c.phone) === p) || null;
  if (!strong && toks.length) {
    const key = [...toks].sort().join(' ');
    for (const c of clients) {
      const ct = nameTokens(c.name);
      if (!ct.length || [...ct].sort().join(' ') !== key) continue;
      const cp = normPhone(c.phone);
      if (p && cp && p !== cp) { cands.push({ c, score: 9 }); continue; }
      strong = c; break;
    }
  }
  if (!strong && toks.length) {
    for (const c of clients) {
      if (cands.some(x => x.c === c)) continue;
      const ct = nameTokens(c.name);
      const shared = toks.filter(t => t.length >= 2 && ct.includes(t)).length;
      if (shared > 0 && (shared >= 2 || toks.length === 1 || ct.length === 1)) cands.push({ c, score: shared });
    }
  }
  cands.sort((a, b) => b.score - a.score);
  return { strong, cands: cands.slice(0, 3).map(x => x.c) };
}

function clientOf(q) { return S.clients.find(c => c.id === q.clientId) || null; }
function clientNameOf(q) { const c = clientOf(q); return (c && c.name) || q.clientName || ''; }
function locationOf(q) { const c = clientOf(q); return q.location || (c && c.address) || ''; }
function effTotal(q) {
  if (q.total != null && q.total !== '') return Number(q.total);
  const bd = (q.breakdown || []).filter(b => b.amount != null && b.amount !== '');
  return bd.length ? bd.reduce((s, b) => s + Number(b.amount), 0) : null;
}
function quotesOf(cid) { return S.quotes.filter(q => q.clientId === cid); }

/* ---------- VAT ---------- */
function rateOf(q) { const r = q && q.vatRate != null && q.vatRate !== '' ? Number(q.vatRate) : Number(S.settings.vatRate); return isNaN(r) ? 18 : r; }
function vatCalc(q) {
  const t = effTotal(q); if (t == null) return null;
  const r = rateOf(q) / 100, R = x => Math.round(x * 100) / 100;
  const net = q.vat === 'incl' ? t / (1 + r) : t, gross = q.vat === 'incl' ? t : t * (1 + r);
  return { net: R(net), vat: R(gross - net), gross: R(gross), rate: rateOf(q) };
}
function shownTotal(q) { const v = vatCalc(q); if (!v) return null; return S.settings.showVatCalc ? v.gross : effTotal(q); }
// a deal that brings income: approved, or already paid and closed
const WON = s => s === 'approved' || s === 'paid';
function statusStamp(q, s) { const o = {}, now = Date.now(); if (WON(s) && !q.approvedAt) o.approvedAt = now; if (s === 'paid' && !q.paidAt) o.paidAt = now; if (s === 'cancelled' && !q.cancelledAt) o.cancelledAt = now; return o; }
function netOf(q) { const v = vatCalc(q); return v ? v.net : 0; }
function vatNotes(q) { return S.settings.showVatCalc && effTotal(q) != null ? [] : [q.vat === 'incl' ? 'המחיר כולל מע"מ' : 'המחיר אינו כולל מע"מ']; }
function vatLineHTML(d) {
  const v = vatCalc({ total: toNum(d.total), vat: d.vat, vatRate: d.vatRate, breakdown: (d.breakdown || []).map(b => ({ label: b.label, amount: toNum(b.amount) })) });
  if (!v) return 'הזן סכום כדי לראות את חישוב המע"מ';
  return 'לפני מע"מ <b>' + esc(fmtMoney(v.net)) + '</b> · מע"מ ' + esc(fmtNum(v.rate)) + '% <b>' + esc(fmtMoney(v.vat)) + '</b> · כולל מע"מ <b>' + esc(fmtMoney(v.gross)) + '</b>';
}
function updateVatLine() { if (!S.draft) return; collectForm(); const el = $('#vatLine'); if (el) el.innerHTML = vatLineHTML(S.draft); }

/* ---------- follow-up on quotes that got no answer ---------- */
function fmtDate(ms) { const d = new Date(ms); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }
function daysText(ms) { const n = Math.max(0, Math.floor((Date.now() - ms) / 864e5)); return n === 0 ? 'היום' : n === 1 ? 'אתמול' : 'לפני ' + n + ' ימים'; }
function followState(q) {
  const days = Number(S.settings.followDays || 0);
  if (!days || !q || !q.id || (q.status || 'pending') !== 'pending') return null;
  const sent = q.sentAt || q.createdAt || Date.now();
  const dueAt = Math.max((q.lastFollowUpAt || sent) + days * 864e5, q.snoozeUntil || 0);
  return { sent, sentMarked: !!q.sentAt, dueAt, due: Date.now() >= dueAt, count: q.followCount || 0 };
}
function dueQuotes() { return S.quotes.filter(q => { const f = followState(q); return f && f.due; }).sort((a, b) => followState(a).dueAt - followState(b).dueAt); }
function reminderText(q) {
  const st = S.settings, t = shownTotal(q), one = (x, sep) => String(x || '').replace(/\s*\n\s*/g, sep || ' ').trim();
  const amount = t == null ? '' : fmtMoney(t) + (st.showVatCalc || q.vat === 'incl' ? ' כולל מע"מ' : ' לא כולל מע"מ');
  const out = String(st.followMsg || DEFAULT_FOLLOW)
    .replace(/\{שם\}/g, one(clientNameOf(q))).replace(/\{מספר\}/g, q.number || '')
    .replace(/\{תאריך\}/g, q.sentAt ? fmtDate(q.sentAt) : (q.date || '')).replace(/\{עבודה\}/g, one(q.title))
    .replace(/\{מיקום\}/g, one(locationOf(q), ', ')).replace(/\{סכום\}/g, amount).replace(/\{עסק\}/g, st.companyName || '');
  // a detail that is missing leaves no empty " · " behind
  return out.split('\n').map(l => l.includes(' · ') ? l.split(' · ').map(x => x.trim()).filter(Boolean).join(' · ') : l).filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n').trim();
}
function reminderLink(q) { return 'https://wa.me/' + intlPhone(q.clientPhone || (clientOf(q) || {}).phone) + '?text=' + encodeURIComponent(reminderText(q)); }
async function patchQuote(q, data) {
  if (!q || !q.id || !S.db) return;
  try { await S.db.doc('quotes/' + q.id).update({ ...data, updatedAt: Date.now() }); if (S.lastSaved && S.lastSaved.id === q.id) Object.assign(S.lastSaved, data); }
  catch (e) { toast('העדכון נכשל: ' + dbErr(e)); }
}
function waTextLink(q) { const ph = intlPhone(q.clientPhone || (clientOf(q) || {}).phone); return 'https://wa.me/' + (ph || '') + '?text=' + encodeURIComponent(quoteText(q)); }
function markSent(q) { if (q && q.id && !q.sentAt) patchQuote(q, { sentAt: Date.now() }); }
function followRow(q) {
  const f = followState(q), t = shownTotal(q);
  return '<div class="frow"><button class="who" data-act="openQuote" data-id="' + esc(q.id) + '"><b>' + esc(clientNameOf(q) || 'ללא שם') + '</b><span class="small muted">מס\' ' + esc(q.number || '-') + (q.title ? ' · ' + esc(q.title) : '') + (t != null ? ' · ' + esc(fmtMoney(t)) : '') + '</span></button>' +
    '<div class="small muted">' + (f.sentMarked ? 'נשלחה ' : 'נוצרה ') + daysText(f.sent) + (f.count ? ' · נשלחו ' + f.count + ' תזכורות' : '') + '</div>' +
    '<div class="btns"><a class="btn sm primary" data-act="remind" data-id="' + esc(q.id) + '" href="' + esc(reminderLink(q)) + '" target="_blank" rel="noopener">' + I.wa + '<span>שלח תזכורת</span></a><button class="btn sm" data-act="followMenu" data-id="' + esc(q.id) + '">עדכן</button></div></div>';
}
function followHTML() {
  const list = dueQuotes(); if (!list.length) return '';
  let h = '<section class="card follow"><h2>' + I.wa + 'למעקב היום <span class="n">' + list.length + (list.length === 1 ? ' הצעה מחכה' : ' הצעות מחכות') + ' לתשובה</span></h2><div>' + list.slice(0, 5).map(followRow).join('') + '</div>';
  if (list.length > 5) h += '<button class="btn sm ghost" data-act="showFollow">לכל ' + list.length + ' ההצעות למעקב</button>';

/* the reminder window: three days (settings) after a quote went out, it pops up by itself when the app is opened */
const SKIP_MS = 3 * 36e5;
function popupQueue() { const now = Date.now(); return dueQuotes().filter(q => q.sentAt && !(S.followSkip[q.id] && now - S.followSkip[q.id] < SKIP_MS)); }
function maybeFollowPopup() {

  showModal('<h3>לשלוח תזכורת ללקוח?</h3>' + (n > 1 ? '<div class="small muted">' + n + ' הצעות מחכות לתשובה. זו הראשונה.</div>' : '') +
    '<div class="fpop-who"><b>' + esc(clientNameOf(q) || 'ללא שם') + '</b><span class="small muted">הצעה מס\' ' + esc(q.number || '-') + (q.title ? ' · ' + esc(q.title.replace(/\s*\n\s*/g, ' ')) : '') + (t != null ? ' · ' + esc(fmtMoney(t)) : '') + '</span></div>' +
    '<div class="small">' + when + '</div>' +

    (phone ? '' : '<div class="small muted">אין טלפון בכרטיס הלקוח, אז בוואטסאפ תבחר למי לשלוח.</div>') +
    '<a class="btn primary big" data-act="popRemind" data-id="' + esc(q.id) + '" href="' + esc(reminderLink(q)) + '" target="_blank" rel="noopener">' + I.wa + '<span>כן, פתח בוואטסאפ</span></a>' +
    '<div class="btns">' + b('popSnooze', 'תזכיר לי מחר') + b('popAnswered', 'הלקוח כבר ענה') + '</div>' + b('popLater', 'לא עכשיו', 'ghost'));

  const b = (act, extra, label, cls) => '<button class="btn' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" data-id="' + esc(id) + '" ' + extra + '>' + label + '</button>';
  showModal('<h3>' + esc(clientNameOf(q) || 'ללא שם') + ' · הצעה ' + esc(q.number || '') + '</h3><div class="small muted">מה קרה עם ההצעה?</div><div class="btns">' + b('setStatus', 'data-s="approved"', 'הלקוח אישר', 'primary') + b('setStatus', 'data-s="rejected"', 'לא מעוניין', 'danger') + '</div><div class="small muted">או להזכיר לי שוב:</div><div class="btns">' + b('snooze', 'data-d="1"', 'מחר') + b('snooze', 'data-d="3"', 'בעוד 3 ימים') + b('snooze', 'data-d="7"', 'בעוד שבוע') + '</div><button class="btn ghost" data-act="closeModal">סגור</button>');

/* ---------- the quote document: drawn on canvas, A4 at 96dpi, in the blue design of the company's quote template ---------- */
const PW = 794, PH = 1123, PM = 64;
const C = { band: '#0a1730', band2: '#0f2347', dark: '#0b2545', acc: '#1f6fd6', soft: '#eef4fd', line: '#c9d8ee', ink: '#1c2330', body: '#2a3240', grey: '#6b7585', faint: '#8a94a6', leader: '#b8c3d3' };

const font = (w, s) => w + ' ' + s + 'px ' + FF;

function quoteText(q) {
  const st = S.settings, L = [];
  const secs = (q.sections || []).filter(s => s.title || (s.items || []).length);
  const bd = (q.breakdown || []).filter(b => b.label || (b.amount != null && b.amount !== ''));
  const total = effTotal(q), vc = vatCalc(q);
  L.push([st.title || 'הצעת מחיר', st.showNumber && q.number ? "מס' " + q.number : ''].filter(Boolean).join(' '));
  L.push('תאריך: ' + (q.date || ''), 'לכבוד: ' + (clientNameOf(q) || ''), 'מיקום: ' + (locationOf(q) || ''));
  if (q.intro) L.push('', q.intro);
  if (secs.length) {
    L.push('', 'תיאור העבודה:');
    secs.forEach((s, i) => { const it = s.items || []; if (s.title && !it.length) { L.push('- ' + s.title); return; } if (s.title) { if (i) L.push(''); L.push('▪ ' + s.title); } it.forEach(x => L.push('- ' + x)); });
  }
  if (bd.length || total != null) {
    L.push('');
    bd.forEach(b => L.push('- ' + b.label + (b.amount != null && b.amount !== '' ? ': ' + fmtMoney(b.amount) : '')));
    if (total != null && st.showVatCalc && vc) L.push('מחיר ללא מע"מ: ' + fmtMoney(vc.net), 'מחיר כולל מע"מ (' + fmtNum(vc.rate) + '%): ' + fmtMoney(vc.gross));

/* ---------- money: balance and expenses ---------- */
const PERIODS = [['month', 'החודש'], ['last', 'חודש שעבר'], ['year', 'השנה'], ['all', 'הכל']];
function periodRange(p) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();

}
const inRange = (t, r) => t >= r[0] && t < r[1];

function expDateShow(x) { const m = String(x.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '.' + m[2] + '.' + m[1] : fmtDate(x.createdAt || Date.now()); }
function isoToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function incomeTime(q) { return q.approvedAt || q.createdAt || 0; }
function expensesOf(qid) { return (S.expenses || []).filter(x => (x.project || '') === (qid || '')); }
// numbers with a sign read left to right inside Hebrew text
function sgn(n, plus) { n = Math.round(n); return '<bdi dir="ltr">' + (n < 0 ? '−' : plus && n > 0 ? '+' : '') + esc(fmtNum(Math.abs(n))) + '</bdi>'; }
const sumExp = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
function projNameOf(id) { const q = id ? S.quotes.find(z => z.id === id) : null; return id && !q ? 'פרויקט שנמחק' : projName(q); }
function projName(q) { return q ? [clientNameOf(q) || 'ללא שם', locationOf(q)].filter(Boolean).join(' · ') : 'כללי, לא שייך לפרויקט'; }

  pinForgot: () => pinForgot(), pinBack: () => { hidePad(); lockNow(true); }, pinWipe: () => pinWipe(),
  kbdHelp: () => kbdGuide(null),
  kbdGo: t => { try { localStorage.setItem(KBD_LS, '1'); } catch (_) { S.kbdGuide = true; } const id = t.dataset.mic; closeModal(); kbdFocus(id); },
  resetGo: () => doReset(),
  dictate: t => dictate(t),
  waPdf: () => sendWaPdf(),
  waText: () => { const q = currentQuote(); if (q) markSent(q); },
  okField: t => okField(t),
  remind: t => { const q = S.quotes.find(x => x.id === t.dataset.id); if (q) patchQuote(q, { lastFollowUpAt: Date.now(), followCount: (q.followCount || 0) + 1, snoozeUntil: 0, sentAt: q.sentAt || Date.now() }); },
  followMenu: t => followMenu(t.dataset.id),
  // the link must still be on the page when the tap finishes, or the phone will not open WhatsApp: close the window right after
  popRemind: t => { const q = S.quotes.find(x => x.id === t.dataset.id); setTimeout(closeModal, 60); if (q) { S.followSkip[q.id] = Date.now(); patchQuote(q, { lastFollowUpAt: Date.now(), followCount: (q.followCount || 0) + 1, snoozeUntil: 0, sentAt: q.sentAt || Date.now() }); } nextPopup(1500); },
  popSnooze: t => { const q = S.quotes.find(x => x.id === t.dataset.id); closeModal(); if (q) { S.followSkip[q.id] = Date.now(); patchQuote(q, { snoozeUntil: Date.now() + 864e5 }).then(() => toast('אזכיר לך מחר.')); } nextPopup(); },
  popAnswered: t => { S.followSkip[t.dataset.id] = Date.now(); closeModal(); followMenu(t.dataset.id); },
  popLater: () => { const now = Date.now(); popupQueue().forEach(q => { S.followSkip[q.id] = now; }); closeModal(); toast('התזכורות מחכות בלשונית "הצעות".'); },
  setStatus: t => { const q = S.quotes.find(x => x.id === t.dataset.id); closeModal(); if (q) patchQuote(q, { status: t.dataset.s, ...statusStamp(q, t.dataset.s) }).then(() => toast(t.dataset.s === 'approved' ? 'סומן כאושרה.' : 'סומן כנדחתה, והמעקב הופסק.')); },
  snooze: t => { const q = S.quotes.find(x => x.id === t.dataset.id); const until = Date.now() + Number(t.dataset.d) * 864e5; closeModal(); if (q) patchQuote(q, { snoozeUntil: until }).then(() => toast('אזכיר לך ב-' + fmtDate(until) + '.')); },
  showFollow: () => { S.qfilter = 'follow'; S.stack = []; S.view = 'quotes'; renderView(); renderChrome(); window.scrollTo(0, 0); },
  shareFile: () => shareFile(),

  clearKey: () => { setApiKey(''); renderChrome(); renderView(); toast('המפתח הוסר. המערכת עובדת בעיבוד בסיסי.'); },
  testKey: async () => {
    const k = ($('#s-apiKey') ? $('#s-apiKey').value.trim() : '') || apiKey();

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const f = A[t.dataset.act];
  if (f) { const nav = t.tagName === 'A' && t.getAttribute('href') && t.getAttribute('href') !== '#'; if (!nav) e.preventDefault(); f(t, e); }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') fitTa(t);

  if (t.id === 'resetWord') { const g = $('#resetGo'); if (g) g.disabled = t.value.trim() !== RESET_WORD; return; }
  if (t.id === 'wipeWord') { const g = $('#wipeGo'); if (g) g.disabled = t.value.trim() !== WIPE_WORD; return; }

document.addEventListener('toggle', e => { if (e.target && e.target.id === 'dictCard') S.dictOpen = e.target.open; if (e.target && e.target.open) fitAll(e.target); }, true);
// Enter in a one-line box (numbers, phone, date, search) finishes it; in a text box Enter is a new line
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.tagName === 'INPUT' && !['checkbox', 'radio', 'file', 'button', 'submit'].includes(t.type)) { e.preventDefault(); t.blur(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'qImport') { const f = t.files && t.files[0]; t.value = ''; if (f) importFile(f); return; }
  if (t.id === 'importInput') { const f = t.files && t.files[0]; t.value = ''; if (f) doImport(f); return; }
  if (t.id === 'imgInput') {
    const files = [...t.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name));
    collectForm(); S.dictOpen = true;
    const room = Math.max(0, (S.imgMax || 0) - S.images.length);
    if (files.length > room) toast('אפשר עד ' + S.imgMax + ' תמונות בהצעה אחת.');
    files.slice(0, room).forEach(f => S.images.push({ file: f, url: URL.createObjectURL(f) }));
    renderView();
  } else if (t.id === 'f-vat') { updateVatLine();
  } else if ((t.id === 'f-name' || t.id === 'f-phone') && S.draft) {
    collectForm();
    if (S.draft.match.mode === 'new' && t.id === 'f-name') S.draft.match.mode = 'auto';
    const mb = $('#matchBox'); if (mb) mb.innerHTML = matchBoxHTML(S.draft);
  }
});

/* ---------- data ---------- */
function onData(kind) {
  renderChrome();
  if (!S.popStarted && S.loaded.quotes && S.loaded.settings) { S.popStarted = true; nextPopup(900); }
  const v = S.view;
  if (v === 'new' || v === 'form') {
    // settings arrived after an untouched new form was drawn: redraw it with the right number and defaults
    if (kind === 'settings' && v === 'new' && S.draft && !S.draft.id && S.draft.fresh) { S.draft = newDraft(); renderView(); return; }
    const mb = $('#matchBox'); if (mb && S.draft && kind === 'clients') { collectForm(); mb.innerHTML = matchBoxHTML(S.draft); }
  }
  else if (v === 'settings') { if (!S.settingsDirty) renderView(); }
  else if (v === 'expenses' && kind !== 'expenses' && kind !== 'quotes') { /* keep what is being typed */ }
  else { const y = window.scrollY; renderView(); window.scrollTo(0, y); }
}
function softRender() { if (S.view !== 'new' && S.view !== 'form' && !(S.view === 'settings' && S.settingsDirty)) renderView(); }
function dbFail(e) { if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { S.dbState = 'off'; renderChrome(); softRender(); } }
function startDb(db) {
  S.db = db;
  if (!db) { S.dbState = 'off'; renderChrome(); softRender(); return; }
  S.dbState = 'on'; renderChrome();
  db.collection('clients').limit(1000).onSnapshot(snap => { S.clients = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.clients = true; onData('clients'); }, dbFail);
  db.collection('quotes').orderBy('createdAt', 'desc').limit(1000).onSnapshot(snap => { S.quotes = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.quotes = true; onData('quotes'); }, dbFail);
  db.collection('expenses').limit(5000).onSnapshot(snap => { S.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.expenses = true; onData('expenses'); }, dbFail);
  db.doc('settings/main').onSnapshot(snap => { if (snap.exists) S.settings = cleanSettings({ ...DEFAULT_SETTINGS, ...snap.data() }); S.loaded.settings = true; onData('settings'); }, dbFail);
}
async function init() {
  const ve = $('#ver'); if (ve) ve.textContent = 'גרסה ' + VERSION;
  if (lockActive()) lockNow();
  S.bkMeta = {}; bkGet('meta').then(m => { S.bkMeta = m || {}; refreshBkCard(); }, () => {});
  renderChrome(); renderView();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { pdfPre = null; if (S.view === 'quote') drawPreview(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let db = null;
  try { db = await makeLocalDb(); } catch (_) { db = null; }
  S.storeMode = db ? db.mode : 'mem';
  startDb(db);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.db) { renderChrome(); softRender(); nextPopup(700); } });
setInterval(maybeFollowPopup, 15 * 6e4);
// on every open, ask the site for its version, bypassing the phone's copy; a newer one is loaded at once
async function checkUpdate() {
  if (location.protocol !== 'https:') return;
  try {
    const base = location.pathname.replace(/[^/]*$/, '');
    const r = await fetch(base + 'index.html', { cache: 'reload' });
    const m = r.ok && (await r.text()).match(/const VERSION = '(\d+)'/);
    if (!m || Number(m[1]) <= Number(VERSION)) return;
    const k = 'gp2-upd-' + m[1];
    try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (_) {}
    try { await fetch(base, { cache: 'reload' }); await fetch(location.pathname, { cache: 'reload' }); } catch (_) {}
    location.reload();
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if ((S.view === 'new' || S.view === 'form') && S.draft && !S.draft.id && $('#qform')) { collectForm(); keepDraft(); } return; } if (S.view !== 'new') checkUpdate(); });
window.addEventListener('pagehide', () => { if ((S.view === 'new' || S.view === 'form') && S.draft && !S.draft.id && $('#qform')) { collectForm(); keepDraft(); } });
init();
const SHARED = /[?&](share|text|title)=/.test(location.search);
if (SHARED) setTimeout(takeShare, 1200); else setTimeout(checkUpdate, 800);
